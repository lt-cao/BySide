[package]
name = "byside-rust-core"
version = "1.5.1"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
